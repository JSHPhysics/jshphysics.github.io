<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KS3 Revision</title>
<meta name="description" content="Self-guiding Key Stage 3 physics revision: clear explanations, worked examples and practice questions checked as you go, with a printable booklet.">
<meta name="theme-color" content="#fbfaf5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15346e" media="(prefers-color-scheme: dark)">
<link rel="preload" href="vendor/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============================================================ -->
<header class="topbar">
  <a class="brand" href="#" id="brand-link" aria-label="KS3 Revision, home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 20 L20 20"/><path d="M4 20 L4 4"/><path d="M4 17 L9 9 L13 13 L20 5"/>
    </svg>
    <span>KS3 Revision</span>
  </a>

  <div class="topbar-title" id="topbar-title"></div>

  <div class="topbar-actions">
    <button class="icon-btn" id="btn-print" title="Print a booklet" aria-label="Print a booklet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M6 14h12v7H6z"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="Paper or blueprint" aria-label="Switch between paper and blueprint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
</header>

<!-- ============================================================ -->
<main class="page" id="main">
  <div class="notice">Loading the booklet…</div>
</main>

<!-- ============================================================ -->
<div class="modal-backdrop" id="print-modal" role="dialog" aria-modal="true" aria-labelledby="print-title">
  <div class="modal">
    <div>
      <h2 id="print-title">Print a booklet</h2>
      <p class="sub">Choose "Save as PDF" in the print dialog to keep a copy.</p>
    </div>

    <div class="field">
      <span>Include</span>
      <div class="opts">
        <label><input type="checkbox" id="p-explain" checked> Explanations</label>
        <label><input type="checkbox" id="p-worked" checked> Worked examples</label>
        <label><input type="checkbox" id="p-hints"> Hints</label>
        <label><input type="checkbox" id="p-space" checked> Space for working</label>
      </div>
    </div>

    <div class="field">
      <span>Answers</span>
      <div class="opts">
        <label><input type="radio" name="p-answers" value="none" checked> Leave out</label>
        <label><input type="radio" name="p-answers" value="final"> Final answers at the back</label>
        <label><input type="radio" name="p-answers" value="full"> Full walkthroughs at the back</label>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn" id="p-cancel">Cancel</button>
      <button class="btn solid" id="p-go">Print</button>
    </div>
  </div>
</div>

<div id="print-root"></div>

<script src="vendor/katex/katex.min.js"></script>
<script src="js/graphs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
